name: CSMS Production CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: LINT & STATIC ANALYSIS ─────────────────────────────────────────
  lint:
    name: 🔍 Lint (Pint & Code Style)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Pint (Code Style Linter)
        run: vendor/bin/pint --test

  # ── STAGE 2: AUTOMATED TESTING ──────────────────────────────────────────────
  test:
    name: 🧪 Test (PHPUnit on PostgreSQL - production engine parity)
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ssmis_test
          POSTGRES_PASSWORD: ssmis_test
          POSTGRES_DB: ssmis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, redis
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate App Key
        run: php artisan key:generate --env=testing

      - name: Execute Test Suite (PHPUnit against PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ssmis_test
          DB_USERNAME: ssmis_test
          DB_PASSWORD: ssmis_test
          DB_URL: ""
        run: php artisan test

  # ── STAGE 3: BUILD PRODUCTION ARTIFACT ──────────────────────────────────────
  build:
    name: 🏗️ Build (Production Artifact)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Install Production Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Optimize Laravel Caches
        run: |
          php artisan config:cache || true
          php artisan route:cache || true

  # ── STAGE 4: ZERO-DOWNTIME DEPLOYMENT ───────────────────────────────────────
  deploy:
    name: 🚀 Deploy (Zero-Downtime Production Deploy)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Production Webhook / Deployment Hook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Triggering deployment webhook..."
            curl -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "Deploy webhook not configured; proceeding to automated GitHub verification."
          fi

  # ── STAGE 5: SMOKE TEST (LIVE HEALTH AUDIT) ─────────────────────────────────
  smoke-test:
    name: 🩺 Smoke Test (Live Health Audit)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Sleep 10s for DNS / Gateway propagation
        run: sleep 10

      - name: Ping Live Production Gateway Health
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.kesararamwithdigital.tech/up)
          echo "Health Endpoint Status: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Smoke test failed: Live health endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Production Gateway is Healthy and Online (HTTP 200 OK)"

  # ── STAGE 6: NOTIFY (SLACK / TEAMS) ─────────────────────────────────────────
  notify:
    name: 📢 Notify (Slack / Teams Status Alert)
    needs: [smoke-test]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack / Teams Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🚀 *CSMS API Deployment Update*\n• Branch: \`main\`\n• Commit: \`${{ github.sha }}\`\n• Status: *Success (All 6 Stages Passed)*\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "Slack notification webhook not set; skipped."
          fi

  # ── STAGE 7: MANUAL ROLLBACK (Disaster Recovery) ────────────────────────────
  # Triggered manually from the Actions tab ("Run workflow") with the commit
  # SHA to redeploy when a bad release reaches production.
  rollback:
    name: ⏪ Rollback (Manual - redeploy previous commit)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath
          coverage: none

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Build Rollback Artifact
        run: |
          cp .env.example .env
          php artisan key:generate --env=production || true
          php artisan config:cache || true
          php artisan route:cache || true

      - name: Trigger Deploy Webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL secret not configured; cannot trigger rollback."
            exit 1
          fi
          SIGNATURE=$(echo -n "${{ github.sha }}" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | sed 's/^.* //')
          curl -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "X-Deploy-Signature: sha256=$SIGNATURE" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.ref }}","rollback":true,"sha":"${{ github.event.inputs.rollback_sha || github.sha }}"}'

      - name: Verify Health After Rollback
        run: |
          sleep 20
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.kesararamwithdigital.tech/up)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Rollback health check failed (HTTP $HTTP_STATUS). Manual intervention required."
            exit 1
          fi
          echo "Rollback complete; gateway healthy."
