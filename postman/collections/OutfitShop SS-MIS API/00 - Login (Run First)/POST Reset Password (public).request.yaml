$kind: http-request
description: Single-use 30-min token; revokes all sessions of the account.
url: "{{base_url}}/auth/reset-password"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "token": "<reset_token>",
      "password": "NewSecret123!",
      "password_confirmation": "NewSecret123!"
    }
order: 6000
