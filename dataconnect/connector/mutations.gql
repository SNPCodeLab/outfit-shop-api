# SS-MIS Data Connect GraphQL Mutations for all 16 Entities

mutation CreateStore($storeName: String!, $code: String!, $phone: String, $email: String, $address: String) @auth(level: PUBLIC) {
  store_insert(data: {
    storeName: $storeName,
    code: $code,
    phone: $phone,
    email: $email,
    address: $address,
    isActive: true
  })
}

mutation CreateCategory($categoryName: String!, $slug: String!, $description: String) @auth(level: PUBLIC) {
  category_insert(data: {
    categoryName: $categoryName,
    slug: $slug,
    description: $description,
    isActive: true
  })
}

mutation CreateProduct($productName: String!, $categoryId: UUID!, $brand: String, $description: String) @auth(level: PUBLIC) {
  product_insert(data: {
    productName: $productName,
    categoryId: $categoryId,
    brand: $brand,
    description: $description,
    status: "ACTIVE"
  })
}

mutation CreateClothingSize($sizeCode: String!, $sizeName: String!, $description: String) @auth(level: PUBLIC) {
  clothingSize_insert(data: {
    sizeCode: $sizeCode,
    sizeName: $sizeName,
    description: $description
  })
}

mutation CreateColor($colorCode: String!, $colorName: String!, $hexCode: String) @auth(level: PUBLIC) {
  color_insert(data: {
    colorCode: $colorCode,
    colorName: $colorName,
    hexCode: $hexCode
  })
}

mutation CreateProductVariant($productId: UUID!, $sku: String!, $costPrice: Float!, $salePrice: Float!, $stockQuantity: Int!) @auth(level: PUBLIC) {
  productVariant_insert(data: {
    productId: $productId,
    sku: $sku,
    costPrice: $costPrice,
    salePrice: $salePrice,
    stockQuantity: $stockQuantity,
    reorderLevel: 10,
    isActive: true
  })
}

mutation CreateSupplier($supplierName: String!, $contactName: String, $phone: String, $email: String) @auth(level: PUBLIC) {
  supplier_insert(data: {
    supplierName: $supplierName,
    contactName: $contactName,
    phone: $phone,
    email: $email,
    status: "ACTIVE"
  })
}

mutation CreateEmployee($storeId: UUID!, $employeeName: String!, $username: String!, $position: String) @auth(level: PUBLIC) {
  employee_insert(data: {
    storeId: $storeId,
    employeeName: $employeeName,
    username: $username,
    position: $position,
    status: "ACTIVE"
  })
}

mutation CreateCustomer($customerName: String!, $phone: String, $email: String) @auth(level: PUBLIC) {
  customer_insert(data: {
    customerName: $customerName,
    phone: $phone,
    email: $email,
    loyaltyPoints: 0
  })
}

mutation UpsertCustomer($id: UUID!, $customerName: String!, $phone: String, $email: String, $loyaltyPoints: Int) @auth(level: PUBLIC) {
  customer_upsert(data: {
    id: $id,
    customerName: $customerName,
    phone: $phone,
    email: $email,
    loyaltyPoints: $loyaltyPoints
  })
}

mutation CreatePurchaseHeader($referenceNo: String!, $supplierId: UUID!, $employeeId: UUID!, $storeId: UUID!, $totalAmount: Float!, $grandTotal: Float!) @auth(level: PUBLIC) {
  purchaseHeader_insert(data: {
    referenceNo: $referenceNo,
    supplierId: $supplierId,
    employeeId: $employeeId,
    storeId: $storeId,
    totalAmount: $totalAmount,
    taxAmount: 0.0,
    grandTotal: $grandTotal,
    status: "COMPLETED"
  })
}

mutation CreatePurchaseDetail($purchaseId: UUID!, $variantId: UUID!, $quantity: Int!, $unitCost: Float!, $subTotal: Float!) @auth(level: PUBLIC) {
  purchaseDetail_insert(data: {
    purchaseId: $purchaseId,
    variantId: $variantId,
    quantity: $quantity,
    unitCost: $unitCost,
    subTotal: $subTotal
  })
}

mutation CreateSaleHeader($invoiceNo: String!, $storeId: UUID!, $employeeId: UUID!, $subTotal: Float!, $grandTotal: Float!) @auth(level: PUBLIC) {
  saleHeader_insert(data: {
    invoiceNo: $invoiceNo,
    storeId: $storeId,
    employeeId: $employeeId,
    subTotal: $subTotal,
    discountAmount: 0.0,
    taxAmount: 0.0,
    grandTotal: $grandTotal,
    paymentStatus: "PAID",
    status: "COMPLETED"
  })
}

mutation CreateSaleDetail($saleId: UUID!, $variantId: UUID!, $quantity: Int!, $unitPrice: Float!, $subTotal: Float!) @auth(level: PUBLIC) {
  saleDetail_insert(data: {
    saleId: $saleId,
    variantId: $variantId,
    quantity: $quantity,
    unitPrice: $unitPrice,
    discountAmount: 0.0,
    subTotal: $subTotal
  })
}

mutation CreatePayment($saleId: UUID!, $amount: Float!, $amountTendered: Float!, $changeDue: Float!, $paymentMethod: String!) @auth(level: PUBLIC) {
  payment_insert(data: {
    saleId: $saleId,
    amount: $amount,
    amountTendered: $amountTendered,
    changeDue: $changeDue,
    paymentMethod: $paymentMethod,
    paymentStatus: "SUCCESS"
  })
}

mutation CreateStockMovement($storeId: UUID!, $variantId: UUID!, $movementType: String!, $quantity: Int!, $stockBefore: Int!, $stockAfter: Int!) @auth(level: PUBLIC) {
  stockMovement_insert(data: {
    storeId: $storeId,
    variantId: $variantId,
    movementType: $movementType,
    quantity: $quantity,
    stockBefore: $stockBefore,
    stockAfter: $stockAfter
  })
}

mutation CreateAuditLog($action: String!, $entityType: String!, $entityId: String, $userId: String) @auth(level: PUBLIC) {
  auditLog_insert(data: {
    action: $action,
    entityType: $entityType,
    entityId: $entityId,
    userId: $userId
  })
}
